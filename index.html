<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quét Thẻ Nhân Viên - Liwayway</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 16px auto; padding: 0 14px; background: #f2f4f8; color: #222; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 14px; }
    h2, h3 { margin-top: 0; }
    .cam-wrap { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    video { width: 100%; max-height: 340px; display: block; object-fit: cover; }
    .guide-box {
      position: absolute; inset: 12% 18%; border: 2px dashed rgba(255,255,255,0.85);
      border-radius: 8px; pointer-events: none;
    }
    canvas { width: 100%; max-height: 260px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; object-fit: contain; background: #111; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-cam { background: #1a73e8; color: #fff; }
    .btn-rot { background: #5f6368; color: #fff; }
    .btn-ocr { background: #0f9d58; color: #fff; }
    .btn-save { background: #e37400; color: #fff; width: 100%; font-size: 15px; padding: 12px; }
    label { display: block; font-size: 13px; color: #444; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .badge { display: block; padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-top: 10px; font-weight: bold; }
    .ok { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .warn { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    #status { margin-top: 8px; font-size: 13px; color: #444; font-weight: bold; }
    #saveMsg { margin-top: 8px; font-size: 14px; font-weight: bold; color: #0f9d58; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Quét Thẻ Nhân Viên (OCR)</h2>
    <div class="cam-wrap">
      <video id="video" autoplay playsinline></video>
      <div class="guide-box"></div>
    </div>

    <div class="row">
      <button class="btn-cam" onclick="moCamera()">1. Bật Camera</button>
      <button class="btn-rot" onclick="xoayKhungHinh()">Xoay ảnh (<span id="degLabel">0</span>°)</button>
      <button class="btn-ocr" onclick="chupVaNhanDien()">2. Chụp & Đọc Thẻ</button>
    </div>

    <div id="status">Trạng thái: Sẵn sàng</div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="card">
    <h3>Kết quả nhận diện & Dò ca làm việc</h3>
    <div id="matchBadge"></div>

    <label>Họ và tên nhân viên</label>
    <input id="hoTen" type="text" placeholder="VD: NGUYỄN NHẬT HÀO C" />

    <div class="grid-2">
      <div>
        <label>Mã nhân viên (VD: PR7155, HR028)</label>
        <input id="maNV" type="text" placeholder="VD: PR7155" />
      </div>
      <div>
        <label>Mã chấm công (Số trong ngoặc)</label>
        <input id="maChamCong" type="text" placeholder="VD: 7000" />
      </div>
    </div>

    <label>Ca làm việc (Tự dò từ Google Sheet)</label>
    <input id="caLamViec" type="text" placeholder="Hiển thị ca làm việc khi dò thấy" />

    <div class="row">
      <button class="btn-save" onclick="luuChamCong()">3. Xác nhận & Ghi chấm công</button>
    </div>
    <div id="saveMsg"></div>

    <label>Văn bản OCR đọc được (dùng kiểm tra / dò lại)</label>
    <textarea id="rawOcr" rows="3"></textarea>
    <button class="btn-rot" style="margin-top:6px;" onclick="xuLyVaDoSheet(document.getElementById('rawOcr').value)">Dò lại từ văn bản trên</button>
  </div>

  <script>
    let stream = null;
    let rotationDeg = 0;
    let foundInList = false;

    async function moCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        document.getElementById('video').srcObject = stream;
        setStatus('Camera đã bật. Đặt thẻ vào khung nét đứt rồi bấm "Chụp & Đọc Thẻ".');
      } catch (err) {
        setStatus('Không mở được camera: ' + err.message);
      }
    }

    function xoayKhungHinh() {
      rotationDeg = (rotationDeg + 90) % 360;
      document.getElementById('degLabel').innerText = rotationDeg;
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = 'Trạng thái: ' + msg;
    }

    // Vẽ ảnh từ video lên canvas theo góc xoay + tăng tương phản giúp đọc cả chữ trắng trên nền đỏ/tím
    function renderProcessedCanvas(video, deg) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (deg === 90 || deg === 270) {
        canvas.width = vh;
        canvas.height = vw;
      } else {
        canvas.width = vw;
        canvas.height = vh;
      }

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((deg * Math.PI) / 180);
      ctx.filter = 'grayscale(100%) contrast(155%) brightness(108%)';
      ctx.drawImage(video, -vw / 2, -vh / 2, vw, vh);
      ctx.restore();

      canvas.style.display = 'block';
      return canvas;
    }

    async function chupVaNhanDien() {
      const video = document.getElementById('video');
      if (!video.srcObject) {
        alert('Vui lòng bấm "Bật Camera" trước.');
        return;
      }

      setStatus('Đang xử lý ảnh và đọc OCR...');
      const anglesToTry = [rotationDeg, (rotationDeg + 270) % 360, (rotationDeg + 90) % 360];
      let bestText = '';
      let parsed = null;

      for (let i = 0; i < anglesToTry.length; i++) {
        const deg = anglesToTry[i];
        setStatus(`Đang quét OCR (góc ${deg}°)...`);
        const canvas = renderProcessedCanvas(video, deg);
        const { data: { text } } = await Tesseract.recognize(canvas, 'vie+eng');
        const candidate = tachThongTinTheLiwayway(text);

        if (candidate.maNV || candidate.maChamCong || candidate.hoTen) {
          bestText = text;
          parsed = candidate;
          rotationDeg = deg;
          document.getElementById('degLabel').innerText = deg;
          break;
        }
        if (!bestText) {
          bestText = text;
          parsed = candidate;
        }
      }

      document.getElementById('rawOcr').value = bestText.trim();
      setStatus('Đọc thẻ xong. Đang dò trên Google Sheet...');
      apDungVaDoSheet(parsed, bestText);
    }

    /**
     * Tách dữ liệu theo đúng bố cục 3 mẫu thẻ Liwayway:
     * - Cụm mã: PR7155 (7000), PL1305 (7235), HR028 (5420)
     * - Họ tên in hoa ngay bên dưới tên công ty (bỏ qua dòng chức vụ: CÔNG NHÂN..., NHÂN VIÊN...)
     */
    function tachThongTinTheLiwayway(rawText) {
      let maNV = '';
      let maChamCong = '';
      let hoTen = '';

      // 1. Bắt cụm MÃ NV (MÃ CHẤM CÔNG) — VD: PR7155 (7000), PL1305 (7235), HR028 (5420)
      const comboRegex = /\b([A-Z]{2}\s*\d{3,5})\s*[\(\[\{]\s*(\d{3,6})\s*[\)\]\}]/i;
      const comboMatch = rawText.match(comboRegex);

      if (comboMatch) {
        maNV = comboMatch[1].replace(/\s+/g, '').toUpperCase();
        maChamCong = comboMatch[2].trim();
      } else {
        // Dự phòng nếu OCR mất dấu ngoặc đơn
        const nvOnly = rawText.match(/\b([A-Z]{2}\s*\d{3,5})\b/i);
        const ccOnly = rawText.match(/[\(\[]\s*(\d{3,6})\s*[\)\]]/);
        if (nvOnly) maNV = nvOnly[1].replace(/\s+/g, '').toUpperCase();
        if (ccOnly) maChamCong = ccOnly[1].trim();
      }

      // 2. Bắt Họ tên (dòng chữ in hoa có dấu tiếng Việt, loại trừ tên công ty & chức danh)
      const ignoreKeywords = [
        'CONG TY', 'CÔNG TY', 'CO PHAN', 'CỔ PHẦN', 'LIWAYWAY', 'VIET NAM', 'VIỆT NAM',
        'CONG NHAN', 'CÔNG NHÂN', 'SAN XUAT', 'SẢN XUẤT', 'VAN HANH', 'VẬN HÀNH',
        'BAO BI', 'BAO BÌ', 'NHAN VIEN', 'NHÂN VIÊN', 'OFFICE', 'STAFF', 'NHAN SU', 'NHÂN SỰ', 'CAP LAN', 'CẤP LẦN'
      ];

      const lines = rawText
        .split(/\r?\n/)
        .map(l => l.replace(/[^A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƠƯẠ-Ỹ\s]/gi, '').replace(/\s+/g, ' ').trim())
        .filter(l => l.length >= 6);

      for (const line of lines) {
        const upper = line.toUpperCase();
        const isIgnored = ignoreKeywords.some(kw => upper.includes(kw));
        const words = upper.split(' ').filter(Boolean);
        // Tên người thường có từ 2 đến 5 từ
        if (!isIgnored && words.length >= 2 && words.length <= 5) {
          hoTen = upper;
          break;
        }
      }

      return { maNV, maChamCong, hoTen };
    }

    function xuLyVaDoSheet(text) {
      const parsed = tachThongTinTheLiwayway(text);
      apDungVaDoSheet(parsed, text);
    }

    function apDungVaDoSheet(parsed, rawText) {
      document.getElementById('maNV').value = parsed.maNV || '';
      document.getElementById('maChamCong').value = parsed.maChamCong || '';
      document.getElementById('hoTen').value = parsed.hoTen || '';

      google.script.run.withSuccessHandler(res => {
        const badge = document.getElementById('matchBadge');
        if (res.found) {
          foundInList = true;
          // Đồng bộ lại thông tin chuẩn từ Google Sheet
          document.getElementById('hoTen').value = res.hoTen;
          document.getElementById('maNV').value = res.maNV;
          document.getElementById('maChamCong').value = res.maChamCong;
          document.getElementById('caLamViec').value = res.caLamViec;

          badge.className = 'badge ok';
badge.innerText = ✓ Có trong danh sách | Ca làm việc: ${res.caLamViec};
} else {
foundInList = false;
document.getElementById('caLamViec').value = '';
badge.className = 'badge warn';
badge.innerText = '✕ Không tìm thấy nhân viên trong danh sách (DanhSachNV)';
}
setStatus('Hoàn tất kiểm tra danh sách.');
}).traCuuNhanVien({
maNV: parsed.maNV,
maChamCong: parsed.maChamCong,
hoTen: parsed.hoTen,
rawText: rawText
});
}
function luuChamCong() {
const payload = {
foundInList,
hoTen: document.getElementById('hoTen').value.trim(),
maNV: document.getElementById('maNV').value.trim(),
maChamCong: document.getElementById('maChamCong').value.trim(),
caLamViec: document.getElementById('caLamViec').value.trim()
};
if (!payload.maNV && !payload.maChamCong && !payload.hoTen) {
alert('Chưa có thông tin nhân viên để lưu.');
return;
}
document.getElementById('saveMsg').innerText = 'Đang ghi vào Google Sheet...';
google.script.run.withSuccessHandler(res => {
document.getElementById('saveMsg').innerText = ✓ Đã ghi lúc ${res.time} — Trạng thái: ${res.status};
}).ghiChamCong(payload);
}

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quét Thẻ Nhân Viên OCR</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 20px auto; padding: 0 16px; background: #f5f7fa; }
    .card { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    video, canvas { width: 100%; max-height: 320px; border-radius: 8px; background: #000; object-fit: cover; }
    .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    button { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-cam { background: #1a73e8; color: #fff; }
    .btn-ocr { background: #0f9d58; color: #fff; }
    .btn-save { background: #e37400; color: #fff; }
    label { display: block; font-size: 13px; color: #444; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .badge { display: inline-block; padding: 6px 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; font-weight: bold; }
    .ok { background: #e6f4ea; color: #137333; }
    .warn { background: #fce8e6; color: #c5221f; }
    #status { margin-top: 8px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Camera Quét Thẻ (OCR)</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div class="row">
      <button class="btn-cam" onclick="moCamera()">Bật Camera</button>
      <button class="btn-ocr" onclick="chupVaNhanDien()">Chụp & Nhận diện OCR</button>
    </div>
    <div id="status">Trạng thái: Chưa bật camera</div>
  </div>

  <div class="card">
    <h3>Thông tin nhận diện & Dò danh sách</h3>
    <label>Văn bản OCR thô</label>
    <textarea id="rawOcr" rows="3" placeholder="Kết quả OCR sẽ hiện ở đây..."></textarea>
    <button class="btn-cam" style="margin-top:8px;" onclick="dòDuLieuTuText()">Dò lại từ văn bản</button>

    <div id="matchBadge"></div>

    <label>Họ tên</label>
    <input id="hoTen" type="text" />

    <label>Mã nhân viên</label>
    <input id="maNV" type="text" />

    <label>Mã chấm công</label>
    <input id="maChamCong" type="text" />

    <label>Ca làm việc</label>
    <input id="caLamViec" type="text" />

    <div class="row">
      <button class="btn-save" onclick="luuChamCong()">Ghi nhận chấm công</button>
    </div>
    <div id="saveMsg"></div>
  </div>

  <script>
    let stream = null;
    let foundInList = false;

    async function moCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        document.getElementById('video').srcObject = stream;
        document.getElementById('status').innerText = 'Trạng thái: Camera đang hoạt động';
      } catch (err) {
        document.getElementById('status').innerText = 'Lỗi mở camera: ' + err.message;
      }
    }

    async function chupVaNhanDien() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      if (!video.srcObject) {
        alert('Vui lòng bật camera trước.');
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      document.getElementById('status').innerText = 'Trạng thái: Đang nhận diện chữ (OCR)...';

      const { data: { text } } = await Tesseract.recognize(canvas, 'vie+eng');
      document.getElementById('rawOcr').value = text.trim();
      document.getElementById('status').innerText = 'Trạng thái: Nhận diện xong';

      tachVaTraCuu(text);
    }

    function dòDuLieuTuText() {
      tachVaTraCuu(document.getElementById('rawOcr').value);
    }

    function tachVaTraCuu(text) {
      // Gợi ý tách nhanh các mẫu thường gặp trên thẻ (VD: NV001, CC001, Họ tên)
      const maNVMatch = text.match(/\bNV\s*[-_:]?\s*\d+\b/i);
      const maCCMatch = text.match(/\bCC\s*[-_:]?\s*\d+\b/i);

      document.getElementById('maNV').value = maNVMatch ? maNVMatch[0].replace(/\s+/g, '').toUpperCase() : '';
      document.getElementById('maChamCong').value = maCCMatch ? maCCMatch[0].replace(/\s+/g, '').toUpperCase() : '';

      const truyVan = [
        document.getElementById('maNV').value,
        document.getElementById('maChamCong').value,
        text.replace(/\s+/g, ' ').trim()
      ].filter(Boolean).join(' | ');

      google.script.run.withSuccessHandler(res => {
        const badge = document.getElementById('matchBadge');
        if (res.found) {
          foundInList = true;
          document.getElementById('hoTen').value = res.hoTen;
          document.getElementById('maNV').value = res.maNV;
          document.getElementById('maChamCong').value = res.maChamCong;
          document.getElementById('caLamViec').value = res.caLamViec;
          badge.className = 'badge ok';
          badge.innerText = `Có trong danh sách — Ca: ${res.caLamViec}`;
        } else {
          foundInList = false;
          badge.className = 'badge warn';
          badge.innerText = 'Không tìm thấy tên/mã trong danh sách nhân viên';
        }
      }).traCuuNhanVien(truyVan);
    }

    function luuChamCong() {
      const payload = {
        foundInList,
        hoTen: document.getElementById('hoTen').value.trim(),
        maNV: document.getElementById('maNV').value.trim(),
        maChamCong: document.getElementById('maChamCong').value.trim(),
        caLamViec: document.getElementById('caLamViec').value.trim()
      };

      if (!payload.hoTen && !payload.maNV && !payload.maChamCong) {
        alert('Chưa có thông tin nhân viên để ghi.');
        return;
      }

      document.getElementById('saveMsg').innerText = 'Đang lưu...';
      google.script.run.withSuccessHandler(res => {
        document.getElementById('saveMsg').innerText = `Đã lưu lúc ${res.time} (${res.status})`;
      }).ghiChamCong(payload);
    }
  </script>
</body>
</html>
